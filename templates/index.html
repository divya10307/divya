<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<header class="hero">

    <div class="hero-content">

        <div class="badge">
            ✨ AI Powered Learning Assistant
        </div>

        <h1>
            EduGenie
        </h1>

        <p>
            Learn smarter with AI.
            Ask questions, understand concepts,
            generate quizzes, summarize notes,
            and create personalized learning paths.
        </p>

    </div>

</header>



<main class="container">


<section class="card">


    <div class="field">

        <label for="task">
            Choose a Task
        </label>

        <select id="task">

            <option value="qa">
                Ask a Question
            </option>

            <option value="explain">
                Explain a Concept
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summarize">
                Summarize Text
            </option>

            <option value="recommend">
                Learning Path
            </option>

        </select>

    </div>



    <div
        class="field"
        id="level-wrap"
        hidden
    >

        <label for="level">
            Learning Level
        </label>

        <select id="level">

            <option value="beginner">
                Beginner
            </option>

            <option value="intermediate">
                Intermediate
            </option>

            <option value="advanced">
                Advanced
            </option>

        </select>

    </div>



    <div class="field">

        <label
            for="inputText"
            id="inputLabel"
        >
            Your Question
        </label>


        <textarea
            id="inputText"
            rows="9"
            placeholder="Type your question here..."
        ></textarea>

    </div>



    <button id="submitBtn">

        Get Answer

    </button>


    <div
        id="status"
        class="status"
    ></div>


</section>



<section class="card result-card">


    <div class="result-header">

        <h2>
            Result
        </h2>


        <button
            id="copyBtn"
            class="secondary"
            hidden
        >
            Copy
        </button>

    </div>


    <div
        id="result"
        class="result empty"
    >

        Your result will appear here.

    </div>


</section>


</main>



<footer>

    EduGenie
    <br>

    FastAPI + Google Gemini

</footer>



<script
    src="{{ url_for('static', path='app.js') }}"
></script>


</body>

</html>
